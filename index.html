<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loupeur</title>
<link rel="stylesheet" href="index.min.css">
<link rel="stylesheet" href="style.css?v=20261109">
</head>
<body>

<div id="banner" class="banner" hidden></div>

<header class="header nb-navbar">
  <h1 class="nb-navbar-brand">Loupeur</h1>
  <div class="header-right">
    <div class="segmented play-mode" id="playMode" role="group" aria-label="Playback mode">
      <button type="button" data-playmode="loop" class="nb-button on">Loop</button>
      <button type="button" data-playmode="sequence" class="nb-button">Sequence</button>
    </div>
    <span class="badge">it loops</span>
  </div>
</header>

<main class="wrap nb-container">

  <section class="panel controls nb-card">
    <div class="control">
      <label class="nb-label" for="bpm">BPM <output id="bpmOut">100</output></label>
      <input type="range" id="bpm" min="60" max="180" step="1" value="100">
    </div>

    <div class="control">
      <label class="nb-label" for="bars">Bars per loop</label>
      <select id="bars" class="nb-dropdown">
        <option value="1" selected>1</option>
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="8">8</option>
      </select>
    </div>

    <div class="control">
      <label class="nb-label">Mode</label>
      <div class="segmented" id="mode">
        <button type="button" data-mode="tempo" class="nb-button on">Tempo Lock</button>
        <button type="button" data-mode="free" class="nb-button">Free</button>
      </div>
    </div>

    <div class="control">
      <label class="nb-label" for="click">Click track</label>
      <input type="checkbox" id="click" class="nb-checkbox" checked>
    </div>

    <div class="control">
      <label class="nb-label" for="clickRec">Click while recording</label>
      <input type="checkbox" id="clickRec" class="nb-checkbox">
    </div>

    <div class="control">
      <label class="nb-label" for="mic">Microphone</label>
      <select id="mic" class="nb-dropdown">
        <option value="">Default input</option>
      </select>
    </div>

    <div class="control">
      <label class="nb-label">Latency <output id="offsetOut">0</output> ms</label>
      <button type="button" id="calibrate" class="nb-button">Calibrate</button>
      <p class="nb-help" id="offsetHelp">Estimated from the browser's reported buffers. Run Calibrate to measure it.</p>
    </div>
  </section>

  <section class="tracks-section">
    <div class="tracks" id="tracks"></div>
    <div class="tracks-actions">
      <button type="button" id="addTrack" class="nb-button add-track">+ Add track</button>
    </div>
  </section>

  <section class="panel sequencer nb-card" id="sequencer">
    <div class="seq-head">
      <h2 class="seq-title">Sequencer</h2>
      <div class="seq-head-right">
        <label class="seq-length" for="seqLength">
          Slots
          <select id="seqLength" class="nb-dropdown">
            <option value="4" selected>4</option>
            <option value="8">8</option>
            <option value="16">16</option>
            <option value="32">32</option>
          </select>
        </label>
        <label class="seq-loop" for="seqLoop">
          <input type="checkbox" id="seqLoop" class="nb-checkbox" checked>
          Loop pattern
        </label>
      </div>
    </div>
    <div class="seq-rows" id="seqRows"></div>
    <p class="nb-help" id="seqHelp">Copy a track to the sequencer, then fill the slots.</p>
  </section>

  <section class="panel output nb-card">
    <div class="control">
      <label class="nb-label" for="reverb">Reverb</label>
      <input type="checkbox" id="reverb" class="nb-checkbox">
    </div>
    <div class="control grow">
      <label class="nb-label" for="master">Master <output id="masterOut">85</output></label>
      <input type="range" id="master" min="0" max="100" step="1" value="85">
    </div>
    <div class="control">
      <label class="nb-label" for="stems">Export tracks separately</label>
      <input type="checkbox" id="stems" class="nb-checkbox">
    </div>
    <button type="button" id="export" class="nb-button orange export">Export Mix</button>
  </section>

  <section class="panel help nb-card">
    <p id="modeHelp">Tempo Lock: 4 bars at 100 BPM. Recording snaps to the grid.</p>
    <p class="keys">
      <kbd>R</kbd> record / punch out (LOOP) &nbsp;·&nbsp;
      <kbd>1</kbd>–<kbd>8</kbd> select track &nbsp;·&nbsp;
      <kbd>Space</kbd> stop / resume
    </p>
  </section>

</main>

<script src="app.js?v=20261109"></script>
</body>
</html>
